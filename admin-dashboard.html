<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Young Prince — Upload Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        header {
            padding: 20px;
            background: #1b1b1b;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 6px 0 0;
            color: #aaa;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 25px 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .top-bar h2 {
            margin: 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .refresh {
            background: #fff;
            color: #111;
        }

        .logout {
            background: #333;
            color: #fff;
        }

        #message {
            margin-bottom: 20px;
            color: #aaa;
        }

        .uploads {
            display: grid;
            gap: 18px;
        }

        .upload-card {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 20px;
        }

        .upload-card h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .upload-card p {
            color: #bbb;
            line-height: 1.5;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #333;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .approve {
            background: #fff;
            color: #111;
        }

        .reject {
            background: #555;
            color: #fff;
        }

        .delete {
            background: #8b0000;
            color: #fff;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #888;
            background: #1c1c1c;
            border-radius: 14px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 24px;
            }

            .container {
                padding: 20px 14px;
            }

            .upload-card {
                padding: 16px;
            }

            .actions button {
                width: 100%;
            }

            .top-bar > div {
                width: 100%;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }

            .top-bar > div button {
                flex: 1;
            }
        }
   /* =========================
   OWNER PUBLICATIONS
========================= */

.owner-section {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 30px;
}

.owner-section h2 {
    margin-top: 0;
}

.owner-form {
    display: grid;
    gap: 14px;
}

.owner-form input,
.owner-form textarea,
.owner-form select {
    width: 100%;
    padding: 12px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

.owner-form textarea {
    min-height: 120px;
    resize: vertical;
}
/* FACEBOOK-STYLE POST COMPOSER */

.post-composer {
    background: #151515;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 16px;
}

.post-composer textarea {
    min-height: 170px;
    border: none;
    background: transparent;
    padding: 10px 0;
    font-size: 16px;
}

.post-composer textarea:focus {
    outline: none;
}

.composer-attachment {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    border-top: 1px solid #333;
    padding-top: 14px;
}

.composer-attachment label {
    background: #292929;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin: 0;
}

.composer-attachment input {
    display: none;
}

#ownerFileName {
    color: #aaa;
    font-size: 13px;
    overflow-wrap: anywhere;
}

#ownerFilePreview {
    display: none;
    margin-top: 12px;
    max-width: 100%;
    max-height: 280px;
    border-radius: 10px;
    object-fit: contain;
}
.owner-form label {
    display: block;
    margin-bottom: 6px;
    color: #ccc;
}

.publish-button {
    background: #fff;
    color: #111;
}

.owner-publications {
    display: grid;
    gap: 18px;
    margin-top: 25px;
}

.owner-card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 18px;
}

.owner-card h3 {
    margin-top: 0;
}

.owner-card p {
    color: #bbb;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.owner-card .status {
    background: #234d32;
}
    </style>
</head>

<body>

<header>
    <h1>Young Prince Admin</h1>
    <p>Upload Review Dashboard</p>
</header>

<main class="container">
<!-- OWNER PUBLICATIONS -->

<section class="owner-section">

    <h2>Publish Your Content</h2>

    <p>
        Upload and publish your own content directly
        to the Young Prince website.
    </p>

   <form
    id="ownerPublishForm"
    class="owner-form"
>

    <div>
        <label for="ownerTitle">
            Publication Title (Optional)
        </label>

        <input
            type="text"
            id="ownerTitle"
            name="title"
            maxlength="200"
            placeholder="Give your post a title..."
        >
    </div>

    <div>
        <label for="ownerCategory">
            Category
        </label>

        <select
            id="ownerCategory"
            name="category"
            required
        >
            <option value="">Select category</option>
            <option value="Original Stories">Original Stories</option>
            <option value="Manga & Art">Manga & Art</option>
            <option value="Videos">Videos</option>
            <option value="Music & Media">Music & Media</option>
            <option value="News Feed">News Feed</option>
        </select>
    </div>

    <div class="post-composer">

        <textarea
            id="ownerDescription"
            name="description"
            maxlength="5000"
            placeholder="What's on your mind? Write your post here..."
        ></textarea>

        <div class="composer-attachment">

            <label for="ownerFile">
                + Add photo, video or file
            </label>

            <input
                type="file"
                id="ownerFile"
                name="file"
                accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"
            >

            <span id="ownerFileName">
                No attachment selected
            </span>

        </div>

        <img
            id="ownerFilePreview"
            alt="Attachment preview"
        >

    </div>

    <button
        type="submit"
        class="publish-button"
        id="ownerPublishButton"
    >
        Publish Post
    </button>

</form>

    <div id="ownerMessage"></div>

    <h2>My Publications</h2>

    <div
        id="ownerPublications"
        class="owner-publications"
    ></div>

</section>

<!-- END OWNER PUBLICATIONS -->
    <div class="top-bar">

        <h2>Submitted Creations</h2>

        <div>

            <button
                class="refresh"
                id="refreshButton"
                type="button"
            >
                Refresh
            </button>

            <button
                class="refresh"
                id="thumbnailButton"
                type="button"
            >
                Generate Thumbnails
            </button>

            <button
                class="logout"
                id="logoutButton"
                type="button"
            >
                Logout
            </button>

        </div>

    </div>

    <div id="message">
        Loading uploads...
    </div>

    <div
        id="uploads"
        class="uploads"
    ></div>

</main>

<script>

const API_BASE_URL =
    "https://youngprincejp-github-io.onrender.com";

const token =
    sessionStorage.getItem(
        "youngPrinceAdminToken"
    );

const uploadsContainer =
    document.getElementById(
        "uploads"
    );

const message =
    document.getElementById(
        "message"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );

const thumbnailButton =
    document.getElementById(
        "thumbnailButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


/* =========================
   LOGIN CHECK
========================= */

if (!token) {

    window.location.href =
        "admin.html";

}


/* =========================
   LOAD UPLOADS
========================= */

async function loadUploads() {

    message.textContent =
        "Loading uploads...";

    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/api/admin/uploads",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            if (
                response.status === 401
            ) {

                sessionStorage.removeItem(
                    "youngPrinceAdminToken"
                );

                window.location.href =
                    "admin.html";

                return;
            }

            throw new Error(
                data.message ||
                "Could not load uploads."
            );
        }

        displayUploads(
            data.uploads || []
        );

    } catch (error) {

        console.error(
            "LOAD UPLOADS ERROR:",
            error
        );

        message.textContent =
            error.message ||
            "Unable to load uploads.";

    }
}


/* =========================
   DISPLAY UPLOADS
========================= */

function displayUploads(
    uploads
) {

    uploadsContainer.innerHTML = "";

    if (!uploads.length) {

        message.textContent = "";

        uploadsContainer.innerHTML = `
            <div class="empty">
                No uploads have been submitted yet.
            </div>
        `;

        return;
    }

    message.textContent =
        `${uploads.length} submission(s)`;

    uploads.forEach(
        upload => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "upload-card";

            const title =
                upload.title ||
                "Untitled Creation";

            const creator =
                upload.name ||
                "Unknown creator";

            const category =
                upload.category ||
                "Uncategorized";

            const description =
                upload.description ||
                "No description provided.";

            const status =
                upload.status ||
                "pending";

            const date =
                upload.uploadedAt
                    ? new Date(
                        upload.uploadedAt
                    ).toLocaleString()
                    : "Unknown date";

            card.innerHTML = `

                <span class="status">
                    ${escapeHtml(status)}
                </span>

                <h3>
                    ${escapeHtml(title)}
                </h3>

                <p>
                    <strong>Creator:</strong>
                    ${escapeHtml(creator)}
                </p>

                <p>
                    <strong>Category:</strong>
                    ${escapeHtml(category)}
                </p>

                <p>
                    <strong>Description:</strong>
                    ${escapeHtml(description)}
                </p>

                <p>
                    <strong>File:</strong>
                    ${escapeHtml(
                        upload.originalName ||
                        "Unknown file"
                    )}
                </p>

                <p>
                    <strong>Uploaded:</strong>
                    ${escapeHtml(date)}
                </p>

                <div class="actions">

                    ${
                        status !== "approved"
                            ? `
                                <button
                                    class="approve"
                                    type="button"
                                    onclick="updateUpload(
                                        '${upload.id}',
                                        'approve'
                                    )"
                                >
                                    Approve
                                </button>
                            `
                            : ""
                    }

                    ${
                        status !== "rejected"
                            ? `
                                <button
                                    class="reject"
                                    type="button"
                                    onclick="updateUpload(
                                        '${upload.id}',
                                        'reject'
                                    )"
                                >
                                    Reject
                                </button>
                            `
                            : ""
                    }

                    <button
                        class="delete"
                        type="button"
                        onclick="deleteUpload(
                            '${upload.id}'
                        )"
                    >
                        Delete
                    </button>

                </div>
            `;

            uploadsContainer.appendChild(
                card
            );

        }
    );
}


/* =========================
   GENERATE MISSING THUMBNAILS
========================= */

async function generateMissingThumbnails() {

    const confirmed =
        confirm(
            "Generate thumbnails for existing uploads that do not have one?"
        );

    if (!confirmed) {
        return;
    }

    thumbnailButton.disabled =
        true;

    thumbnailButton.textContent =
        "Generating...";

    message.textContent =
        "Generating missing thumbnails...";

    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/api/admin/uploads/generate-thumbnails",
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (
            response.status === 401
        ) {

            sessionStorage.removeItem(
                "youngPrinceAdminToken"
            );

            window.location.href =
                "admin.html";

            return;
        }

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Thumbnail generation failed."
            );
        }

        message.textContent =
            data.message ||
            "Thumbnail generation completed.";

        await loadUploads();

    } catch (error) {

        console.error(
            "THUMBNAIL GENERATION ERROR:",
            error
        );

        message.textContent =
            error.message ||
            "Unable to generate thumbnails.";

    } finally {

        thumbnailButton.disabled =
            false;

        thumbnailButton.textContent =
            "Generate Thumbnails";

    }
}


/* =========================
   APPROVE / REJECT
========================= */

async function updateUpload(
    id,
    action
) {

    const confirmed =
        confirm(
            action === "approve"
                ? "Approve this submission?"
                : "Reject this submission?"
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                API_BASE_URL +
                `/api/admin/uploads/${id}/${action}`,
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (
            response.status === 401
        ) {

            sessionStorage.removeItem(
                "youngPrinceAdminToken"
            );

            window.location.href =
                "admin.html";

            return;
        }

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Action failed."
            );
        }

        await loadUploads();

    } catch (error) {

        console.error(
            "UPDATE UPLOAD ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to complete action."
        );

    }
}


/* =========================
   DELETE
========================= */

async function deleteUpload(
    id
) {

    const confirmed =
        confirm(
            "Delete this upload permanently?"
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                API_BASE_URL +
                `/api/admin/uploads/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (
            response.status === 401
        ) {

            sessionStorage.removeItem(
                "youngPrinceAdminToken"
            );

            window.location.href =
                "admin.html";

            return;
        }

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Delete failed."
            );
        }

        await loadUploads();

    } catch (error) {

        console.error(
            "DELETE UPLOAD ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to delete upload."
        );

    }
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
    value
) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   BUTTONS
========================= */

refreshButton.addEventListener(
    "click",
    async function() {

        await loadUploads();

        await loadOwnerPublications();

    }
);

thumbnailButton.addEventListener(
    "click",
    generateMissingThumbnails
);

logoutButton.addEventListener(
    "click",
    function () {

        sessionStorage.removeItem(
            "youngPrinceAdminToken"
        );

        window.location.href =
            "admin.html";

    }
);
/* =========================
   OWNER PUBLICATION FUNCTIONS
========================= */

const ownerPublishForm =
    document.getElementById("ownerPublishForm");

const ownerPublishButton =
    document.getElementById("ownerPublishButton");

const ownerMessage =
    document.getElementById("ownerMessage");

const ownerPublicationsContainer =
    document.getElementById("ownerPublications");


/* PUBLISH CONTENT */

ownerPublishForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const formData =
            new FormData(ownerPublishForm);

        ownerPublishButton.disabled = true;

        ownerPublishButton.textContent =
            "Publishing...";

        ownerMessage.textContent =
            "Uploading your publication...";

        try {

            const response =
                await fetch(
                    API_BASE_URL + "/api/admin/media",
                    {
                        method: "POST",

                        headers: {
                            "Authorization": "Bearer " + token
                        },

                        body: formData
                    }
                );

            const data =
                await response.json();

            if (response.status === 401) {

                sessionStorage.removeItem(
                    "youngPrinceAdminToken"
                );

                window.location.href = "admin.html";

                return;
            }

            if (!response.ok) {
                throw new Error(
                    data.message || "Publication failed."
                );
            }

            ownerMessage.textContent =
                "Publication uploaded successfully!";

            ownerPublishForm.reset();

            await loadOwnerPublications();

        } catch (error) {

            console.error(
                "OWNER PUBLISH ERROR:",
                error
            );

            ownerMessage.textContent =
                error.message || "Unable to publish content.";

        } finally {

            ownerPublishButton.disabled = false;

            ownerPublishButton.textContent =
                "Publish Content";

        }

    }
);
    
/* =========================
   LOAD OWNER PUBLICATIONS
========================= */

async function loadOwnerPublications() {

    ownerPublicationsContainer.innerHTML =
        '<div class="empty">Loading your publications...</div>';

    try {

        const response =
            await fetch(
                API_BASE_URL + "/api/admin/media",
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (response.status === 401) {

            sessionStorage.removeItem(
                "youngPrinceAdminToken"
            );

            window.location.href = "admin.html";

            return;
        }

        if (!response.ok) {
            throw new Error(
                data.message || "Could not load publications."
            );
        }

        displayOwnerPublications(
            data.items || []
        );

    } catch (error) {

        console.error(
            "LOAD OWNER PUBLICATIONS ERROR:",
            error
        );

        ownerPublicationsContainer.innerHTML =
            '<div class="empty">Unable to load your publications.</div>';

    }
}


/* DISPLAY OWNER PUBLICATIONS */

function displayOwnerPublications(items) {

    ownerPublicationsContainer.innerHTML = "";

    if (!items.length) {

        ownerPublicationsContainer.innerHTML =
            '<div class="empty">You have not published anything yet.</div>';

        return;
    }

    items.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "owner-card";

        const title =
            item.title || "Untitled Publication";

        const category =
            item.category || "Uncategorized";

        const description =
            item.description || "No description provided.";

        const date =
            item.publishedAt
                ? new Date(item.publishedAt).toLocaleString()
                : "Unknown date";

        card.innerHTML = `

            <span class="status">
                Published
            </span>

            <h3>${escapeHtml(title)}</h3>

            <p>
                <strong>Category:</strong>
                ${escapeHtml(category)}
            </p>

            <p>
                ${escapeHtml(description)}
            </p>

            <p>
                <strong>File:</strong>
                ${escapeHtml(item.originalName || "Unknown file")}
            </p>

            <p>
                <strong>Published:</strong>
                ${escapeHtml(date)}
            </p>

            <div class="actions">

                <button
                    class="delete"
                    type="button"
onclick="deleteOwnerPublication('${escapeHtml(item.id || "")}')"                >
                    Delete Publication
                </button>

            </div>

        `;

        ownerPublicationsContainer.appendChild(card);

    });

}
    
/* =========================
   DELETE OWNER PUBLICATION
========================= */

async function deleteOwnerPublication(id) {

    const confirmed =
        confirm(
            "Delete this publication permanently?"
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/api/admin/media/" +
               encodeURIComponent(decodeURIComponent(id)),
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (response.status === 401) {

            sessionStorage.removeItem(
                "youngPrinceAdminToken"
            );

            window.location.href = "admin.html";

            return;
        }

        if (!response.ok) {
            throw new Error(
                data.message ||
                "Could not delete publication."
            );
        }

        ownerMessage.textContent =
            "Publication deleted successfully.";

        await loadOwnerPublications();

    } catch (error) {

        console.error(
            "DELETE OWNER PUBLICATION ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to delete publication."
        );

    }
}    
    
/* =========================
   START
========================= */

loadUploads();

loadOwnerPublications();

</script>

</body>
</html>
