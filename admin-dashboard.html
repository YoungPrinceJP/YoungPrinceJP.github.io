</main>

<script>

const API_BASE_URL =
    "https://youngprincejp-github-io.onrender.com";

const token =
    sessionStorage.getItem(
        "youngPrinceAdminToken"
    );

const uploadsContainer =
    document.getElementById(
        "uploads"
    );

const message =
    document.getElementById(
        "message"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );

const thumbnailButton =
    document.getElementById(
        "thumbnailButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


/* =========================
   LOGIN CHECK
========================= */

if (!token) {

    window.location.href =
        "admin.html";

}


/* =========================
   LOAD UPLOADS
========================= */

async function loadUploads() {

    message.textContent =
        "Loading uploads...";

    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/api/admin/uploads",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            if (
                response.status === 401
            ) {

                sessionStorage.removeItem(
                    "youngPrinceAdminToken"
                );

                window.location.href =
                    "admin.html";

                return;
            }

            throw new Error(
                data.message ||
                "Could not load uploads."
            );
        }

        displayUploads(
            data.uploads || []
        );

    } catch (error) {

        message.textContent =
            error.message ||
            "Unable to load uploads.";

    }
}


/* =========================
   DISPLAY UPLOADS
========================= */

function displayUploads(
    uploads
) {

    uploadsContainer.innerHTML = "";

    if (!uploads.length) {

        message.textContent = "";

        uploadsContainer.innerHTML = `
            <div class="empty">
                No uploads have been submitted yet.
            </div>
        `;

        return;
    }

    message.textContent =
        `${uploads.length} submission(s)`;

    uploads.forEach(
        upload => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "upload-card";

            const title =
                upload.title ||
                "Untitled Creation";

            const creator =
                upload.name ||
                "Unknown creator";

            const category =
                upload.category ||
                "Uncategorized";

            const description =
                upload.description ||
                "No description provided.";

            const status =
                upload.status ||
                "pending";

            const date =
                upload.uploadedAt
                    ? new Date(
                        upload.uploadedAt
                    ).toLocaleString()
                    : "Unknown date";

            card.innerHTML = `

                <span class="status">
                    ${escapeHtml(status)}
                </span>

                <h3>
                    ${escapeHtml(title)}
                </h3>

                <p>
                    <strong>Creator:</strong>
                    ${escapeHtml(creator)}
                </p>

                <p>
                    <strong>Category:</strong>
                    ${escapeHtml(category)}
                </p>

                <p>
                    <strong>Description:</strong>
                    ${escapeHtml(description)}
                </p>

                <p>
                    <strong>File:</strong>
                    ${escapeHtml(
                        upload.originalName ||
                        "Unknown file"
                    )}
                </p>

                <p>
                    <strong>Uploaded:</strong>
                    ${escapeHtml(date)}
                </p>

                <div class="actions">

                    ${
                        status !== "approved"
                            ? `
                                <button
                                    class="approve"
                                    type="button"
                                    onclick="updateUpload(
                                        '${upload.id}',
                                        'approve'
                                    )"
                                >
                                    Approve
                                </button>
                            `
                            : ""
                    }

                    ${
                        status !== "rejected"
                            ? `
                                <button
                                    class="reject"
                                    type="button"
                                    onclick="updateUpload(
                                        '${upload.id}',
                                        'reject'
                                    )"
                                >
                                    Reject
                                </button>
                            `
                            : ""
                    }

                    <button
                        class="delete"
                        type="button"
                        onclick="deleteUpload(
                            '${upload.id}'
                        )"
                    >
                        Delete
                    </button>

                </div>
            `;

            uploadsContainer.appendChild(
                card
            );

        }
    );
}


/* =========================
   GENERATE MISSING THUMBNAILS
========================= */

async function generateMissingThumbnails() {

    const confirmed =
        confirm(
            "Generate thumbnails for existing uploads that do not have one?"
        );

    if (!confirmed) {
        return;
    }

    thumbnailButton.disabled =
        true;

    thumbnailButton.textContent =
        "Generating...";

    message.textContent =
        "Generating missing thumbnails...";

    try {

        const response =
            await fetch(
                API_BASE_URL +
                "/api/admin/uploads/generate-thumbnails",
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (
            response.status === 401
        ) {

            sessionStorage.removeItem(
                "youngPrinceAdminToken"
            );

            window.location.href =
                "admin.html";

            return;
        }

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Thumbnail generation failed."
            );
        }

        message.textContent =
            data.message ||
            "Thumbnail generation completed.";

        await loadUploads();

    } catch (error) {

        console.error(
            "THUMBNAIL GENERATION ERROR:",
            error
        );

        message.textContent =
            error.message ||
            "Unable to generate thumbnails.";

    } finally {

        thumbnailButton.disabled =
            false;

        thumbnailButton.textContent =
            "Generate Thumbnails";

    }
}


/* =========================
   APPROVE / REJECT
========================= */

async function updateUpload(
    id,
    action
) {

    const confirmed =
        confirm(
            action === "approve"
                ? "Approve this submission?"
                : "Reject this submission?"
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                API_BASE_URL +
                `/api/admin/uploads/${id}/${action}`,
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Action failed."
            );
        }

        await loadUploads();

    } catch (error) {

        alert(
            error.message ||
            "Unable to complete action."
        );

    }
}
