<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Your Creation | Young Prince</title>

    <style>

        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.08),
            transparent 45%
        ),
        #0b0b0b;
    color: white;
    min-height: 100vh;
}

     .upload-page {
    max-width: 760px;
    margin: 0 auto;
    padding: 50px 20px 80px;
}

       h1 {
    text-align: center;
    font-size: 36px;
    margin: 10px 0 12px;
    letter-spacing: 0.5px;
}

.upload-page > p {
    text-align: center;
    opacity: 0.7;
    margin-bottom: 35px;
}

      .upload-box {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px);
}

        label {
    display: block;
    margin-top: 22px;
    margin-bottom: 9px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    opacity: 0.9;
}
 input,
select,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 15px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.06);
    color: white;
    font-size: 15px;
    outline: none;
    transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

input:focus,
select:focus,
textarea:focus {
    border-color: rgba(255, 255, 255, 0.45);
    background: rgba(255, 255, 255, 0.09);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
}

        textarea {
    min-height: 140px;
    resize: vertical;
    line-height: 1.6;
}
        .file-label {
            display: block;
            padding: 20px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }

        #uploadFile {
            display: none;
        }

        #uploadButton {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #uploadStatus {
            margin-top: 20px;
            text-align: center;
        }

        .back-link {
            display: block;
            margin-bottom: 25px;
            color: white;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <main class="upload-page">

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Young Prince
        </a>

        <h1>
            📤 Upload Your Creation
        </h1>

        <div class="upload-box">

            <p>
                Share your artwork, stories, videos, music
                and creative work with the Young Prince community.
            </p>

            <label for="uploaderName">
                Your Name
            </label>

            <input
                type="text"
                id="uploaderName"
                placeholder="Enter your name"
            >

            <label for="contentTitle">
                Title
            </label>

            <input
                type="text"
                id="contentTitle"
                placeholder="Give your creation a title"
            >

            <label for="contentCategory">
                Category
            </label>

            <select id="contentCategory">

                <option value="">
                    Select a category
                </option>

                <option value="story">
                    📖 Story / Writing
                </option>

                <option value="image">
                    🖼️ Artwork / Image
                </option>

                <option value="video">
                    🎬 Video
                </option>

                <option value="music">
                    🎵 Music / Audio
                </option>

                <option value="document">
                    📄 Document
                </option>

                <option value="other">
                    📦 Other
                </option>

            </select>

            <label for="contentDescription">
                Description
            </label>

            <textarea
                id="contentDescription"
                placeholder="Tell us about your creation"
            ></textarea>

            <label>
                File
            </label>

            <label
                for="uploadFile"
                class="file-label"
            >
                📁 Choose a file
                <br>
                <small>
                    Click here to select your creation
                </small>
            </label>

            <input
                type="file"
                id="uploadFile"
            >

            <button
                type="button"
                id="uploadButton"
            >
                📤 Submit Upload
            </button>

            <div id="uploadStatus"></div>

        </div>

    </main>


    <script>

        const API_BASE_URL =
            "https://youngprincejp-github-io.onrender.com";


        const uploadButton =
            document.getElementById("uploadButton");


        const uploadStatus =
            document.getElementById("uploadStatus");


        uploadButton.addEventListener(
            "click",
            async function() {

                const uploaderName =
                    document.getElementById(
                        "uploaderName"
                    ).value.trim();

                const contentTitle =
                    document.getElementById(
                        "contentTitle"
                    ).value.trim();

                const contentCategory =
                    document.getElementById(
                        "contentCategory"
                    ).value;

                const contentDescription =
                    document.getElementById(
                        "contentDescription"
                    ).value.trim();

                const file =
                    document.getElementById(
                        "uploadFile"
                    ).files[0];


                if (!uploaderName) {

                    uploadStatus.textContent =
                        "Please enter your name.";

                    return;
                }


                if (!contentTitle) {

                    uploadStatus.textContent =
                        "Please enter a title.";

                    return;
                }


                if (!contentCategory) {

                    uploadStatus.textContent =
                        "Please select a category.";

                    return;
                }


                if (!file) {

                    uploadStatus.textContent =
                        "Please choose a file.";

                    return;
                }


                const formData =
                    new FormData();

                formData.append(
                    "name",
                    uploaderName
                );

                formData.append(
                    "title",
                    contentTitle
                );

                formData.append(
                    "category",
                    contentCategory
                );

                formData.append(
                    "description",
                    contentDescription
                );

                formData.append(
                    "file",
                    file
                );


                uploadStatus.textContent =
                    "Uploading...";


                uploadButton.disabled =
                    true;


                try {

                    const response =
                        await fetch(
                            API_BASE_URL +
                            "/api/upload",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            result.message ||
                            "Upload failed."
                        );

                    }


                    uploadStatus.textContent =
                        result.message ||
                        "Upload submitted successfully.";

                    uploadButton.disabled =
                        false;


                } catch (error) {

                    console.error(
                        "UPLOAD ERROR:",
                        error
                    );

                    uploadStatus.textContent =
                        error.message ||
                        "Upload failed. Please try again.";

                    uploadButton.disabled =
                        false;

                }

            }
        );

    </script>

</body>

</html>
